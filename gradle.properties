org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# One module, so parallel execution buys nothing but extra worker JVMs competing for the same
# heap — which is what makes CI runners thrash rather than build.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Pin the Kotlin compile daemon's heap. Left unset it sizes itself from the machine and, alongside
# Gradle and KSP, can push a 4-core runner into GC thrash.
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
ksp.incremental=true
